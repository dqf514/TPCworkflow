# HTTPS — IMC Workflow @ wf.imcsh.com
# 请将 ssl_certificate / ssl_certificate_key 换成实际证书路径

upstream imcwf_backend {
    server 127.0.0.1:5320;
    keepalive 32;
}

server {
    listen 80;
    server_name wf.imcsh.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wf.imcsh.com;

    ssl_certificate     /etc/nginx/ssl/wf.imcsh.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wf.imcsh.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 64m;

    # 通用反代头（Session Cookie、Azure 回调、附件下载均依赖）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # SSE 长连接（桌面客户端实时待办）
    location = /api/v1/client/events/stream {
        proxy_pass http://imcwf_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }

    # Windows 客户端安装包（约 70MB+，覆盖 zip / exe 子路径）
    location ~ ^/api/v1/client/download(/setup|/zip|/exe)?$ {
        proxy_pass http://imcwf_backend;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # REST API
    location /api/ {
        proxy_pass http://imcwf_backend;
        proxy_read_timeout 120s;
    }

    # SPA + 嵌入页（WebView2 加载 /tasks、/apply 等）
    location / {
        proxy_pass http://imcwf_backend;
        proxy_read_timeout 120s;
    }
}
