# wf.imcsh.com 生产环境 Nginx 增补说明
#
# 现状：location / → 10.1.40.109:5321（Web 前端，不动）
# 增补：location /api/ → 10.1.40.109:5320（后端 API，供桌面客户端 + 浏览器同源 API）
#
# 原理：Nginx 按最长前缀匹配，/api/ 比 / 更具体，仅 API 请求走后端，页面仍走 5321。

upstream imcwf_api {
    server 10.1.40.109:5320;
    keepalive 16;
}

# ========== 在现有 443 server { ... } 内、location / 之前插入以下两段 ==========

    # 桌面客户端 SSE 长连接（必须放在 /api/ 前面，使用精确匹配）
    location = /api/v1/client/events/stream {
        proxy_pass http://imcwf_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }

    # 桌面客户端安装包（大文件，关闭缓冲并延长超时；覆盖 zip / exe 子路径）
    location ~ ^/api/v1/client/download(/setup|/zip|/exe)?$ {
        proxy_pass http://imcwf_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 后端 REST API（客户端 Bearer + Cookie 登录、验证码、待办等）
    location /api/ {
        proxy_pass http://imcwf_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ========== 以下保持你现有的 location / 不变 ==========
    # location / {
    #     proxy_pass http://10.1.40.109:5321;
    #     ...
    # }

# ========== 后端 5320 进程环境变量（systemd 或启动脚本）==========
# BEHIND_PROXY=true
# SESSION_COOKIE_SECURE=1

# ========== 验证 ==========
# curl -s https://wf.imcsh.com/api/v1/health
# curl -s https://wf.imcsh.com/api/v1/auth/captcha
# 均应返回 JSON，不能以 < 开头
